# Host nginx vhost for api.kyklosedu.gr — NOT the containerised nginx.
#
# Two nginx layers sit in front of Nest, and they are configured in different
# places. This is the outer one, installed on the VPS itself:
#
#   browser → this vhost (:443) → kyklos-nginx container (:8081) → Nest (:5000)
#
# The container's config lives in nginx/nginx.conf and nginx/conf.d/ and is
# deployed with the code. This file is not: nothing in deploy.sh,
# deploy-zero-downtime.sh or the Actions workflow writes it, so it has to be
# installed by hand once per host. It is kept here so a rebuilt server can be
# brought back to a known state instead of a guessed one.
#
# Install:
#   scp nginx/host/api.kyklosedu.gr.conf root@HOST:/etc/nginx/sites-available/kyklos-backend
#   ssh root@HOST 'ln -sf /etc/nginx/sites-available/kyklos-backend \
#                        /etc/nginx/sites-enabled/kyklos-backend && \
#                  nginx -t && systemctl reload nginx'
#
# The ssl_* lines are certbot's (installer = nginx). Leave them to certbot; it
# edits this block in place on renewal and preserves everything else.

server {
    server_name api.kyklosedu.gr;

    # Without this nginx caps request bodies at its 1MB default and every larger
    # upload dies with 413 before reaching Nest — the browser only sees a failed
    # request, so the admin panel reports "the image did not upload" and the
    # article can never satisfy its cover-image requirement. 50M covers the
    # archive upload UI; news cover images are capped at 10MB by multer.
    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Large uploads over a slow connection must not hit the 60s defaults.
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.kyklosedu.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kyklosedu.gr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = api.kyklosedu.gr) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.kyklosedu.gr;
    return 404;
}
