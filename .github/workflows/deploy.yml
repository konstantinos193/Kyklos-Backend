name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/kyklos-backend

            # Pull latest code
            git pull origin main
            chmod +x deploy-zero-downtime.sh

            # Deploy into whichever colour is idle, so the live one keeps
            # serving until the new container is healthy and nginx has been
            # reloaded onto it.
            if docker ps --format '{{.Names}}' | grep -qx kyklos-backend-green; then
              COLOR=blue
            else
              COLOR=green
            fi

            ./deploy-zero-downtime.sh "$COLOR"
